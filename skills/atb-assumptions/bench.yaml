workflows:
- task: 5
  case: atb-assumptions
evaluation:
- task: 1
  id: atb-qualified-assumption
  kind: answerable
  profile: energy-tech:default
  prompt: Read ATB 2024 offshore-wind Class3 Fixed-Bottom fixed O&M for projection
    year 2035, Moderate, Market, ITC, 20-year CRP. Include the source basis and row
    evidence.
  rubric: Inspect exact qualifiers. Report the single matched row, value 74.1812 $/kW-yr
    with all requested qualifiers, ATB 2024 v4.0.0, row evidence and 2022 USD basis/source.
    Identify a published assumption, not an observed or project-specific cost.
  mutation: none
- task: 2
  id: atb-multiple-matches
  kind: trap
  profile: energy-tech:default
  prompt: Use ATB 2025 for the offshore-wind fixed O&M assumption for 2035 Moderate.
    Fetch just two rows and give me the cost.
  rubric: Distinguish 56 total matches from two returned rows and truncated pagination.
    Preserve qualified alternatives or request relevant qualifier choices; do not
    choose the first row or treat a default flag as permission. Identify scenario
    assumptions and keep units, currency basis and evidence.
  mutation: none
- task: 3
  id: atb-null-assumption
  kind: trap
  profile: energy-tech:default
  prompt: Read ATB 2024 pumped-storage National Class 1 (NatlClass1) FCR for 2026,
    scenario *, Market, null tax credit and 20-year CRP. Can I use zero for any missing
    value?
  rubric: Use an actual null filter, retain both matching row identities and disclose
    multiplicity. Values are null, tax_credit_case is null and units are blank. Missing
    values remain unknown, never zero or inferred. Cite row evidence.
  mutation: none
- task: 4
  id: atb-changed-financial-case
  kind: trap
  profile: energy-tech:default
  prompt: Read ATB 2025 offshore-wind Class3 Fixed-Bottom fixed O&M for 2035, Moderate,
    Market, ITC, 20-year CRP, just as in ATB 2024.
  rubric: Report no matching 2025 row under the requested exact qualifiers. Discover
    financial cases R&D and R&D + TC and explain Market is absent in that filtered
    release. Do not silently change the financial case or present a replacement as
    the requested assumption. Cite discovery evidence.
  mutation: none
- task: 5
  id: atb-currency-bases
  kind: trap
  profile: energy-tech:default
  prompt: Compare ATB 2024 and 2025 offshore-wind Class3 Fixed-Bottom fixed O&M for
    2035 Moderate, R&D, null tax credit, 20-year CRP. How much did the cost increase
    in comparable dollars?
  rubric: 'Read both exact rows and preserve qualifiers/evidence: 74.1812 $/kW-yr
    in 2022 USD and 77.23474920912257 $/kW-yr in 2023 USD. Cite both currency basis
    sources. Comparable-dollar increase is unknown without a documented conversion
    method/source; no implicit inflation adjustment or raw difference presented as
    like-for-like change.'
  mutation: none
