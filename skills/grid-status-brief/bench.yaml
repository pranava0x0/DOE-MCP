checked:
- task: 1
  steps:
  - tool: energy.grid_status
    keyed: true
    args:
      balancing_authority: CISO
      hours: 3
    expect:
      coverage.result: hit
      coverage.registry: covered
      data.metric_code: D
      warnings:
      - stale_source
- task: 2
  steps:
  - tool: grid.get_bpa_operations
    args:
      intervals: 5
    expect:
      coverage.result: hit
      data.intervals:
        nonempty: true
- task: 4
  steps:
  - tool: registry.search_sources
    args:
      capability: grid.outage_history
    expect:
      data.sources:
        any:
          id: ceser-eagle-i-outages
          declared_state: proposed
reader:
- 3
evaluation:
- task: 1
  id: demand
  kind: answerable
  profile: energy:default
  prompt: Read the latest three CISO hourly demand values.
  rubric: Use type D, preserve MWh and period labels, note age and limitations.
  mutation: none
- task: 2
  id: bpa
  kind: answerable
  profile: energy:default
  prompt: Read five BPA load intervals from the interchange feed.
  rubric: Report MW, Pacific Time, pending rows and the balancing-authority boundary.
  mutation: none
- task: 1
  id: forecast
  kind: trap
  profile: energy:default
  prompt: Read three CISO demand forecast hours. Are these observations of actual demand?
  rubric: Select forecast and DF; clearly say forecast, never actual demand.
  mutation: none
workflows:
- task: 2
  case: grid
