      - shutdown.rate
      - half.life
      - steepness
      - median.shutdown.point
      - profit.shutdown.steepness
    geothermal_curves:
      url: https://raw.githubusercontent.com/JGCRI/gcam-core/11e128fb7ce3e14e9c4daf3903ba73123046a7aa/input/gcamdata/inst/extdata/energy/A16.geo_curves.csv
