id: ornl-constellation
name: Constellation
domain: research

publisher:
  steward: ornl
  authority_level: primary

aliases:
  former_names: []
  former_domains: []

labs: [ornl]

# Capabilities stay empty until this source is active: a capability id
# is a routing promise, and the activation gate refuses one from a
# manifest nothing can query. What this source would serve is listed
# under planned_capabilities, which nothing routes on.
capabilities: []

adapter:
  type: none

access:
  mode: anonymous
  automation_status: public_api
  tier: catalog_pointer
  terms_url: https://constellation.ornl.gov/
  terms_notes: >
    ORNL's institutional data repository; records also reach DOE Data
    Explorer.

freshness:
  expected_cadence: continuous
  cadence_source: >
    Observed; deposit-driven.
  ttl_hint_seconds: 86400

coverage:
  scope: >
    ORNL-produced datasets deposited institutionally.
  temporal: current
  dataset_version: "current"
  known_limitations:
    - >
      Already indexed by DOE Data Explorer, so the discovery route
      exists today through an adapter this project has. A dedicated
      integration would buy little.

authority_notes: >
  A good illustration of decision 0009-B: fanning out from DDE reaches
  repositories that would otherwise each need their own adapter.

health:
  probe: none

lifecycle:
  declared_state: proposed
  added: "2026-09-02"
  last_verified: "2026-09-01"
  verified_by: pranava0x0
  blocked_reason: >
    Already reachable through DOE Data Explorer; a direct integration is
    low value.
