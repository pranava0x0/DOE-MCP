id: ornl-oncat
name: ONCat (Oak Ridge Neutron Catalog)
domain: research

publisher:
  steward: ornl
  authority_level: primary

aliases:
  former_names: []
  former_domains: []

labs: [ornl]

# Capabilities stay empty until this source is active: a capability id
# is a routing promise, and the activation gate refuses one from a
# manifest nothing can query. What this source would serve is listed
# under planned_capabilities, which nothing routes on.
capabilities: []

adapter:
  type: none

access:
  mode: anonymous
  automation_status: unknown
  tier: catalog_pointer
  terms_url: https://oncat.ornl.gov/
  terms_notes: >
    A catalog over neutron-scattering experiment data at SNS and HFIR.
    Whether a public tier exists is unconfirmed; the survey's
    recommended next step is an email.

freshness:
  expected_cadence: continuous
  cadence_source: >
    Observed; experiment-driven.
  ttl_hint_seconds: 86400

coverage:
  scope: >
    Metadata for neutron scattering experiments at ORNL's user
    facilities.
  temporal: current
  dataset_version: "current"
  known_limitations:
    - >
      User-facility data is proposal-gated by design. If a public
      metadata tier exists it is the derived layer this project targets;
      raw experiment data is a permanent non-goal.

authority_notes: >
  Intended capabilities: research-adjacent facility metadata. Phase 4.

health:
  probe: none

lifecycle:
  declared_state: proposed
  added: "2026-09-02"
  last_verified: "2026-09-01"
  verified_by: pranava0x0
  blocked_reason: >
    Public tier unconfirmed. Named in architecture Part 1 section 4.7 as an email to
    send.
