id: doe-nepa-documents
name: DOE NEPA document database
domain: docs

publisher:
  steward: doe
  authority_level: primary

aliases:
  former_names: []
  former_domains: []

labs: []

# Capabilities stay empty until this source is active: a capability id
# is a routing promise, and the activation gate refuses one from a
# manifest nothing can query. What this source would serve is listed
# under planned_capabilities, which nothing routes on.
capabilities: []

planned_capabilities: [docs.search_nepa]
adapter:
  type: none

access:
  mode: anonymous
  automation_status: manual_review_required
  tier: crawl_or_defer
  terms_url: https://www.energy.gov/nepa/
  terms_notes: >
    Public HTML listings of environmental impact statements,
    environmental assessments, and categorical exclusions. No API found.

freshness:
  expected_cadence: continuous
  cadence_source: >
    Observed; documents posted as reviews proceed.
  ttl_hint_seconds: 86400

coverage:
  scope: >
    DOE's National Environmental Policy Act documents.
  temporal: historical through current
  dataset_version: "current"
  known_limitations:
    - >
      A crawler-class source, which is Gate B work and Phase 5 at the
      earliest.
    - >
      PNNL's NEPA-MCP already serves this territory: 23 servers and
      56 tools at 0.1.6 (2026-09-06), and GSA re-hosted it from its own
      fork until GSA wound its hub down on 2026-09-03. Under decision
      0011 that makes this a catalog entry with an install recipe rather
      than something to rebuild — absorbing a 56-tool surface would
      breach the sizing ceiling on its own.

authority_notes: >
  Intended capabilities: docs.search_nepa, and probably never built
  here. The federation entry is in sources/catalog/.

health:
  probe: none

lifecycle:
  declared_state: proposed
  added: "2026-09-02"
  last_verified: "2026-09-01"
  verified_by: pranava0x0
  blocked_reason: >
    Deliberately not built: NEPA-MCP serves it. Registered so the
    registry can say so and route the caller there, which is the
    difference between a coverage gap and a coverage decision.
