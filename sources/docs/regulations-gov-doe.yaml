id: regulations-gov-doe
name: Regulations.gov v4 (DOE dockets)
domain: docs

publisher:
  steward: gsa
  authority_level: primary

aliases:
  former_names: []
  former_domains: []

labs: []

capabilities: []
planned_capabilities: ['docs.docket_metadata']
adapter:
  type: regulations_gov
  base_url: https://api.regulations.gov/v4
  credential_ref: API_DATA_GOV_KEY
  agency_ids: ['EERE']

access:
  mode: api_key
  credential_ref: API_DATA_GOV_KEY
  automation_status: public_api
  tier: thin_proxy
  terms_url: https://open.gsa.gov/api/regulationsgov/
  terms_reviewed_at: "2026-11-21"
  terms_notes: >
    GSA documents GET access to docket and document metadata, with an
    api.data.gov key in the X-Api-Key header. The public demonstration
    key is for API exploration; live tools require a user-owned key.
    Comment submission uses POST and is outside this adapter.
  rate_limit_note: >
    api.data.gov publishes request limits; inspect the response headers
    for the applicable allowance. The demonstration responses in the
    2026-11-21 probe advertised a limit of ten. Do not retry a refusal
    by changing keys or hosts.

freshness:
  expected_cadence: continuous
  cadence_source: >
    Observed; documents carry lastModifiedDate.
  ttl_hint_seconds: 3600

coverage:
  scope: >
    Regulations.gov docket and document metadata under the verified EERE
    agency code, including publisher identifiers, modification dates and
    comment windows when supplied. Other DOE agency codes are not yet
    verified. No public comment text, attachments or document bodies.
  temporal: By docket, as exposed by the publisher
  dataset_version: "current"
  known_limitations:
    - >
      The verified agency scope is EERE only. This historical code does
      not establish complete coverage of DOE or its current offices.
    - >
      Document searches require an exact docket id and are bounded to
      twenty rows per page and twenty pages. A page is not a full docket.
    - >
      Comment dates and withdrawal fields are publisher metadata; they
      do not establish a legal deadline or the complete public record.

authority_notes: >
  Primary publisher metadata. The Federal Register source carries the
  published notice; this source describes its docket and documents.
  The November implementation serves the verified EERE subset only.

health:
  probe: regulations_gov_docket
  expect:
    min_records: 1

lifecycle:
  declared_state: proposed
  added: "2026-09-08"
  last_verified: "2026-11-21"
  verified_by: pranava0x0
  blocked_reason: >
    Awaiting the guarded three-request exploration recording and replay
    checks. Live operation requires the user's api.data.gov key.
