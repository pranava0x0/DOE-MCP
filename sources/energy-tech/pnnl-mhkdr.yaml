id: pnnl-mhkdr
name: Marine and Hydrokinetic Data Repository
domain: energy-tech

publisher:
  steward: pnnl
  authority_level: official_secondary

aliases:
  former_names: []
  former_domains: []

labs: [pnnl]

# Capabilities stay empty until this source is active: a capability id
# is a routing promise, and the activation gate refuses one from a
# manifest nothing can query. What this source would serve is listed
# under planned_capabilities, which nothing routes on.
capabilities: []

planned_capabilities: [dataset.search]
adapter:
  type: none

access:
  mode: anonymous
  automation_status: public_download
  tier: catalog_pointer
  terms_url: https://mhkdr.openei.org/
  terms_notes: >
    Public submissions with per-dataset licences. A harvesting API is
    referred to in the platform's own material but was not located
    during the survey.

freshness:
  expected_cadence: continuous
  cadence_source: >
    Observed; submission-driven.
  ttl_hint_seconds: 86400

coverage:
  scope: >
    Marine and hydrokinetic energy research data: wave, tidal, and
    current energy projects.
  temporal: current
  dataset_version: "current"
  known_limitations:
    - >
      The harvesting API is documented somewhere the survey did not
      find. Until it is located, this is inventory.

authority_notes: >
  Intended capabilities: dataset.search, filtered to this repository
  (decision 0026). Phase 4. Sits alongside PRIMRE
  and Tethys in PNNL's marine-energy family.

health:
  probe: none

lifecycle:
  declared_state: proposed
  added: "2026-09-02"
  last_verified: "2026-09-01"
  verified_by: pranava0x0
  blocked_reason: >
    Harvesting-API documentation not located. Next step is asking PNNL
    directly.
