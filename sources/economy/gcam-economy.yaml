id: gcam-economy
name: 'GCAM: Regional economics'
domain: economy
publisher:
  steward: pnnl
  authority_level: primary
aliases:
  former_names: []
  former_domains: []
labs:
- pnnl
capabilities:
- id: model.economy_inputs
  tool_hint: economy.country_regions
adapter:
  type: gcam_csv
  base_url: https://raw.githubusercontent.com
  tables:
    country_regions:
      url: https://raw.githubusercontent.com/JGCRI/gcam-core/11e128fb7ce3e14e9c4daf3903ba73123046a7aa/input/gcamdata/inst/extdata/common/iso_GCAM_regID.csv
      columns:
      - iso
      - country_name
      - region_GCAM3
      - GCAM_region_ID
    region_names:
      url: https://raw.githubusercontent.com/JGCRI/gcam-core/11e128fb7ce3e14e9c4daf3903ba73123046a7aa/input/gcamdata/inst/extdata/common/GCAM_region_names.csv
      columns:
      - GCAM_region_ID
      - region
    industrial_elasticity:
      url: https://raw.githubusercontent.com/JGCRI/gcam-core/11e128fb7ce3e14e9c4daf3903ba73123046a7aa/input/gcamdata/inst/extdata/socioeconomics/A32.inc_elas_output.csv
      columns:
      - pc.output_GJ
      - inc_elas
    building_elasticity:
      url: https://raw.githubusercontent.com/JGCRI/gcam-core/11e128fb7ce3e14e9c4daf3903ba73123046a7aa/input/gcamdata/inst/extdata/socioeconomics/A42.inc_elas.csv
      columns:
      - pcgdp_90thousUSD
      - inc_elas
    transport_elasticity:
      url: https://raw.githubusercontent.com/JGCRI/gcam-core/11e128fb7ce3e14e9c4daf3903ba73123046a7aa/input/gcamdata/inst/extdata/socioeconomics/A52.inc_elas.csv
      columns:
      - pcgdp_90thousUSD
      - inc_elas
    factor_productivity:
      url: https://raw.githubusercontent.com/JGCRI/gcam-core/11e128fb7ce3e14e9c4daf3903ba73123046a7aa/input/gcamdata/inst/extdata/socioeconomics/A81.factor_productivity.csv
      columns:
      - fn.name
      - node.name
      - leaf.name
      - '1971'
      - '2020'
      - '2100'
    labor_sectors:
      url: https://raw.githubusercontent.com/JGCRI/gcam-core/11e128fb7ce3e14e9c4daf3903ba73123046a7aa/input/gcamdata/inst/extdata/socioeconomics/A_labor_supply_sector.csv
      columns:
      - GCAM_region_ID
      - region
      - supplysector
      - output.unit
      - input.unit
      - region_AgProdGrowth
      - logit.exponent
      - price.unit
      - logit.year.fillout
      - logit.type
access:
  mode: anonymous
  automation_status: public_download
  tier: thin_proxy
  terms_url: https://raw.githubusercontent.com/JGCRI/gcam-core/11e128fb7ce3e14e9c4daf3903ba73123046a7aa/input/gcamdata/LICENSE
  terms_reviewed_at: '2026-11-09'
  terms_notes: The GCAM data system distributes these model configuration tables under the Educational
    Community License 2.0. Keep the publisher's source notes with the values.
  citation_required: true
  citation_text: Joint Global Change Research Institute, Pacific Northwest National Laboratory. GCAM v9.1,
    gcamdata. Cite the specific input file and retain its source notes.
  rate_limit_note: One small file per read; cached for one day.
freshness:
  expected_cadence: per release
  cadence_source: Git commit pinned to the published gcam-v9.1 tag.
  ttl_hint_seconds: 86400
coverage:
  scope: Regional economics input tables from the Global Change Analysis Model.
  temporal: Years and currency bases vary by table.
  dataset_version: GCAM v9.1
  known_limitations:
  - Rows are model inputs, not scenario outputs or measurements of current conditions.
  - GCAM3 region labels and numeric GCAM region IDs use different groupings.
authority_notes: JGCRI publishes these files as GCAM inputs. Citations in each file identify the sources
  used to construct them.
health:
  probe: gcam_table_rows
  expect:
    min_records: 1
lifecycle:
  declared_state: active
  added: '2026-11-09'
  last_verified: '2026-11-09'
  verified_by: Codex
