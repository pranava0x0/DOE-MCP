id: ceser-eagle-i-outages
name: EAGLE-I historical outage datasets
domain: energy

publisher:
  steward: ceser
  host: ornl
  authority_level: primary

aliases:
  former_names: []
  former_domains: []

labs: [ornl]

capabilities:
  - id: grid.outage_history
    tool_hint: grid.find_outage_history

planned_capabilities: []

# The release series, not the catalog it is filed in. DOE Data Explorer
# holds the annual EAGLE-I releases as seven records; the pinned title
# filter is what makes this source those seven rather than DDE's million,
# and it is why this manifest is a second route to OSTI's API rather than a
# second adapter (decision 0025 counts routes to one publisher; here the
# publisher is CESER and the route is OSTI).
adapter:
  type: osti_family
  base_url: https://www.osti.gov/dataexplorer/api/v1
  flavor: records
  record_path: /records
  biblio_url_template: https://www.osti.gov/dataexplorer/biblio/{id}
  supported_filters: []
  fixed_filters:
    title: EAGLE-I

access:
  mode: anonymous
  automation_status: public_api
  tier: catalog_pointer
  terms_url: https://www.osti.gov/dataexplorer/about
  terms_notes: >
    The live EAGLE-I platform is gated to authorised users. The ANNUAL
    HISTORICAL datasets are published openly through OSTI and DOE Data
    Explorer, and the catalog route is the same anonymous, keyless OSTI
    API the research server already reads. Releases for 2014-2022, 2023,
    2024 and 2025, a documentation record and a county customer-count
    dataset were listed on 2026-10-08. The files themselves sit behind
    each release's DOI at ORNL's Constellation repository; this source
    returns the DOI and never fetches the files.
  terms_reviewed_at: "2026-10-08"
  terms_gap: >
    No published rate limit, same as the rest of the OSTI family.
  citation_required: false
  rate_limit_note: >
    One small catalog query per cache window answers every call; the
    series is seven records.

freshness:
  expected_cadence: annual
  cadence_source: >
    Observed; one release per year, published early the following year
    (the 2025 release is dated 2026-01-31 and 2026-02-18).
  ttl_hint_seconds: 86400

coverage:
  scope: >
    The catalog records of EAGLE-I's annual historical outage releases:
    county-level counts of customers without power at 15-minute
    intervals, 2014 onward, with the documentation record and the county
    customer-count dataset that serves as the denominator.
  temporal: 2014 onward
  dataset_version: "current"
  record_count: 7
  record_count_checked: "2026-10-08"
  known_limitations:
    - >
      Pointers to the releases, not outage numbers. Each release is a set
      of files behind its DOI; this source says which release covers a
      year and where it is, and reading the files is a second step.
    - >
      The live platform is not this. Anyone wanting current outage status
      needs the gated system or a utility's own feed; this is history,
      published a year at a time.
    - >
      Roughly 92% of customers, not all. The gap is small utilities and
      cooperatives, and it is not randomly distributed: rural areas are
      underrepresented in exactly the analyses that most want them.
    - >
      Customers out is not people out, and an interval count is not an
      outage event. Turning the series into events or durations is a
      modelling choice the releases leave to the reader.
    - >
      OSTI lists the 2025 release twice, under two record ids with one
      DOI. The tool reports the release once and names both records.

authority_notes: >
  Primary: CESER sponsors EAGLE-I and ORNL builds and publishes it. The
  largest single find of the program-office press sweep, reachable through
  an adapter this project already had because the release route is OSTI.
  Activated on 2026-10-08 in doe-energy-data, which serves the measured
  grid (decision 0026).

health:
  probe: osti_total_count
  expect:
    min_records: 4

lifecycle:
  declared_state: active
  added: "2026-09-02"
  last_verified: "2026-10-08"
  verified_by: pranava0x0
