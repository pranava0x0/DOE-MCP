id: lbnl-emp-datasets
name: LBNL Electricity Markets and Policy datasets
domain: energy

publisher:
  steward: lbnl
  authority_level: primary

aliases:
  former_names: []
  former_domains: []

labs: [lbnl]

# Capabilities stay empty until this source is active: a capability id
# is a routing promise, and the activation gate refuses one from a
# manifest nothing can query. What this source would serve is listed
# under planned_capabilities, which nothing routes on.
capabilities: []

planned_capabilities: [grid.interconnection_queue]
adapter:
  type: none

access:
  mode: anonymous
  automation_status: public_download
  tier: catalog_pointer
  terms_url: https://emp.lbl.gov/
  terms_notes: >
    Public research datasets published as spreadsheets and through OEDI.
    Openly available; LBNL asks for citation of the associated reports.

freshness:
  expected_cadence: annual
  cadence_source: >
    Stated; the flagship datasets are annual research products with
    named editions.
  ttl_hint_seconds: 86400

coverage:
  scope: >
    Tracking the Sun (roughly 4.5 million distributed solar systems),
    Queued Up (interconnection queue analysis), and Utility-Scale Solar.
  temporal: varies by product
  dataset_version: "annual editions"
  known_limitations:
    - >
      Spreadsheet-shaped, so a parse job rather than an API call, and
      the parse is version-specific: column layouts change between
      annual editions.
    - >
      Queued Up is an ANALYSIS of interconnection queues, not the queues
      themselves. Presenting it as the live queue would be wrong; the
      queues belong to the transmission operators.

authority_notes: >
  Primary for LBNL's own analysis. Intended capabilities:
  grid.interconnection_queue as an indexed source. Phase 3.

health:
  probe: none

lifecycle:
  declared_state: proposed
  added: "2026-09-02"
  last_verified: "2026-09-01"
  verified_by: pranava0x0
  blocked_reason: >
    Phase 3. Spreadsheet parsing per annual edition; no access obstacle.
