id: doe-ccms-certification
name: CCMS Compliance Certification Database (appliance and equipment standards)
domain: energy

publisher:
  steward: cmei
  authority_level: primary

aliases:
  former_names: []
  former_domains: []

labs: []

# Capabilities stay empty until this source is active: a capability id
# is a routing promise, and the activation gate refuses one from a
# manifest nothing can query. What this source would serve is listed
# under planned_capabilities, which nothing routes on.
capabilities: []

planned_capabilities: ['products.certified_models']
adapter:
  type: none

access:
  mode: anonymous
  automation_status: unknown
  tier: thin_proxy
  terms_url: https://www.regulations.doe.gov/certification-data/
  terms_notes: >
    DOE describes the database as public, searchable, and
    downloadable, refreshed about every two weeks, holding
    certification reports for current basic models across more than
    sixty product categories. A scripted request returned 403 on
    2026-09-08, so the posture is unknown until a browser has looked.

freshness:
  expected_cadence: every two weeks
  cadence_source: >
    Stated on the CCMS pages.
  ttl_hint_seconds: 86400

coverage:
  scope: >
    Manufacturer certification records for consumer products and
    commercial equipment covered by federal energy-conservation
    standards: model numbers, rated performance, and compliance
    statements.
  temporal: current basic models submitted within the past year
  dataset_version: "current"
  known_limitations:
    - >
      Current models only. Records older than a year drop out of the
      public database by design.
    - >
      A 403 to a scripted client is not evidence of a gate. Recorded as
      blocked_probe.

authority_notes: >
  Primary: DOE's Building Technologies Office, now under CMEI after
  the EERE dissolution, runs the certification program. Found in the
  2026-09-08 gap sweep.

health:
  probe: none

lifecycle:
  declared_state: proposed
  added: "2026-09-08"
  last_verified: "2026-09-08"
  verified_by: pranava0x0
  blocked_reason: >
    Blocked probe. One browser-grade check settles it; then the export
    format decides whether this is a thin proxy or a parsed copy under
    Gate E.
