id: lbnl-ameriflux
name: AmeriFlux
domain: earth

publisher:
  steward: lbnl
  authority_level: official_secondary

aliases:
  former_names: []
  former_domains: []

labs: [lbnl]

# Capabilities stay empty until this source is active: a capability id
# is a routing promise, and the activation gate refuses one from a
# manifest nothing can query. What this source would serve is listed
# under planned_capabilities, which nothing routes on.
capabilities: []

planned_capabilities: [earth.search_streams]
adapter:
  type: none

access:
  mode: account_token
  automation_status: manual_review_required
  tier: catalog_pointer
  terms_url: https://ameriflux.lbl.gov/data/data-policy/
  terms_notes: >
    Tiered data policy with a POST-shaped download request and an
    account. Some tiers REQUIRE citation and some require contacting the
    site principal investigator, so the terms are per-tier rather than
    per-site.

freshness:
  expected_cadence: continuous
  cadence_source: >
    Observed; sites report continuously, with periodic processed
    releases.
  ttl_hint_seconds: 86400

coverage:
  scope: >
    Eddy-covariance carbon, water, and energy flux measurements across
    the Americas.
  temporal: 1990s onward
  dataset_version: "current"
  known_limitations:
    - >
      Data-use policy tiers carry different obligations, including
      contacting the site PI for some data. A tool that returned the
      data without the obligation would be handing a caller a problem.
    - >
      Individual towers are run by individual investigators; LBNL
      operates the network. For any one site the PI is the authority.

authority_notes: >
  Intended capabilities: earth.search_streams. Phase 4, metadata-first.

health:
  probe: none

lifecycle:
  declared_state: proposed
  added: "2026-09-02"
  last_verified: "2026-09-01"
  verified_by: pranava0x0
  blocked_reason: >
    Tiered policy with per-tier obligations. Metadata is the safe
    surface; data access needs the policy tiers modelled properly first.
