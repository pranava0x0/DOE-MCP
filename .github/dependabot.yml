# Keeps the SHA pins in the workflows current. Dependabot understands a
# commit pin with a version comment and raises the bump as a reviewable pull
# request, which is the whole point of pinning: a change to an action becomes
# a diff somebody reads rather than a tag quietly moved underneath us.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The Python pins are exact (decision 0004), so a bump is a reviewable
  # pull request rather than a range that moves on its own. Added
  # 2026-09-11, when a review found the pins drifting with nothing watching.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
