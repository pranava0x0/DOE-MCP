name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly liveness probe, architecture Part 1 § 20 risk 1: churn is the
    # defining risk and a dead endpoint should be known within a week, not
    # when the next pull request happens to run.
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Least privilege, per the CI hardening checklist § 3. With no block a job
# inherits the repository's default GITHUB_TOKEN scope, which can be
# read/write across contents and packages. Nothing in this workflow writes:
# it checks out, installs, and runs tests and probes. The scheduled liveness
# job matters most here — a weekly job holding a write token is § 6's case.
permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs rather than tags (§ 1): a tag can be moved
      # onto attacker code and every run after it is compromised silently.
      # Dependabot understands these pins and bumps them as reviewable pull
      # requests.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv python install 3.12
      - run: uv venv
      - run: echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH && echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV
      - name: Install
        run: uv pip install -e ".[all]" pytest==9.1.1 pytest-asyncio==1.4.0 ruff==0.13.0

      - name: Lint
        # The rule set is in pyproject.toml: bug-finding rules only. Style
        # is not enforced here; the writing checker covers prose.
        run: ruff check .

      - name: Validate the source registry
        # The activation gates run on every load, so this fails on a manifest
        # that claims to be active without a terms review, a probe, or a
        # capability it can serve.
        run: doe-mcp sources validate

      - name: Tests
        # Nothing here reaches the network: every test replays recorded
        # publisher responses, so a failure is this project's fault.
        run: python -m pytest

      - name: The envelope schema matches the models
        run: |
          python tools/build_schema.py
          git diff --exit-code schemas/envelope.schema.json \
            || (echo "::error::schemas/envelope.schema.json is stale. Run tools/build_schema.py." && exit 1)

      - name: The site, the README status block, and the tool reference match the registry
        # DECISIONS 0017's staleness test. A published page claiming coverage
        # the registry does not have is a claim this project cannot back; the
        # README table and docs/reference.md are generated by the same run.
        run: |
          python tools/build_site.py --fixtures
          git diff --exit-code docs/ README.md \
            || (echo "::error::docs/ or README.md is out of date. Run tools/build_site.py --fixtures." && exit 1)

  liveness:
    # Separate job, and allowed to fail: a DOE endpoint being down is not a
    # reason to block a pull request. It IS a reason to know, which is why
    # this job also runs on the weekly schedule.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv python install 3.12
      - run: uv venv
      - run: echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH && echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV
      - run: uv pip install -e ".[all]"
      - name: Probe the keyless active sources
        run: doe-mcp sources probe
